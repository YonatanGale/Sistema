<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Encuesta - Sistema de Encuestas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-clipboard-data"></i> Sistema de Encuestas
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Bienvenido, {{ current_user.username }}</span>
                <a href="{{ url_for('encuestas.mis_encuestas') }}" class="btn btn-outline-light me-2">
                    <i class="bi bi-list-ul"></i> Mis Encuestas
                </a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-plus-circle"></i> Crear Nueva Encuesta
                        </h4>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <label for="titulo" class="form-label fw-bold">
                                    <i class="bi bi-pencil-square"></i> Título de la Encuesta
                                </label>
                                <input type="text" class="form-control form-control-lg" id="titulo" 
                                       name="titulo" placeholder="Ej: Encuesta de Satisfacción 2026" required>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label fw-bold">
                                    <i class="bi bi-card-text"></i> Descripción
                                </label>
                                <textarea class="form-control" id="descripcion" name="descripcion" 
                                          rows="4" placeholder="Describe el propósito de esta encuesta..."></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="{{ url_for('encuestas.mis_encuestas') }}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-check-circle"></i> Crear Encuesta y Agregar Preguntas
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
